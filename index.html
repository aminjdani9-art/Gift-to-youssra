<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>thank u youssra</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Amiri:wght@700&family=Dancing+Script&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050108;min-height:100vh;overflow:hidden;display:flex;justify-content:center;align-items:center}
#intro{position:fixed;inset:0;background: radial-gradient(ellipse at center, #1a0a14 0%, #05020a 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;transition:opacity 1s}
#intro p{font-family:'Amiri',serif;font-size:32px;color:#fff;text-shadow:0 0 20px #ff4d8d}
#timer{font-family:'Great Vibes',cursive;font-size:80px;color:#ff3e8a;margin-top:30px;text-shadow:0 0 20px #ff3e8a,0 0 50px #ff3e8a}
#main{width:100%;height:100vh;display:flex;flex-direction:column;align-items:center;opacity:0;transition:opacity 1.2s;padding:20px;background: radial-gradient(ellipse at center, #120812 0%, #050108 70%);overflow-y:auto}
h2{font-family:'Great Vibes',cursive;font-size:52px;color:#ff3e8a;text-shadow:0 0 15px #ff3e8a,0 0 35px #ff3e8a;margin-top:40px}
h2 span{color:#fff;text-shadow:0 0 15px #fff,0 0 35px #fff}
.sub{font-family:'Dancing Script',cursive;color:#ffb3d1;font-size:18px;margin-bottom:25px}
#textBox{width:400px;max-width:92vw;padding:25px;border:1px solid rgba(255,77,141,0.25);border-radius:20px;background:rgba(255,77,141,0.06);line-height:2.2;text-align:center}
.word{font-family:'Great Vibes',cursive;font-size:21px;color:#ffb3d6;text-shadow:0 0 5px #fff,0 0 12px #ff4d8d,0 0 25px #ff2d78;opacity:0;animation:show .6s forwards;display:inline-block;margin:0 4px}
.word.youssra{font-size:31px;color:#fff;text-shadow:0 0 10px #fff,0 0 25px #ff4d8d,0 0 50px #ff2d78}
@keyframes show{to{opacity:1}}
.cursor{display:inline-block;width:2px;height:20px;background:#ff6ab3;box-shadow:0 0 8px #ff4d8d;margin-left:4px;animation:blink .7s infinite;vertical-align:middle}
@keyframes blink{0%,50%{opacity:1} 51%,100%{opacity:0}}
/* الفيديو شفاف ومخفي - غير الصوت لي خدام */
#bgAudio, #bgVideo{position:fixed; width:1px; height:1px; opacity:0; pointer-events:none; left:-9999px; top:-9999px;}
</style>
</head>
<body>

<!-- الفيديو مخفي - الصوت فقط هو لي غيخدم -->
<audio id="bgAudio" loop preload="auto" playsinline>
  <source src="https://files.catbox.moe/6pa0rw.mp4" type="video/mp4">
</audio>
<video id="bgVideo" loop preload="auto" playsinline style="display:none">
  <source src="https://files.catbox.moe/6pa0rw.mp4" type="video/mp4">
</video>

<div id="intro">
  <p>هادا كادو ليك نتمنا يعجبك💞</p>
  <div id="timer">3</div>
</div>

<div id="main">
  <h2>Thank You <span>Youssra</span></h2>
  <div class="sub">with respect and gratitude</div>
  <div id="textBox"></div>
</div>

<script>
const audio = document.getElementById('bgAudio');
let ctx, gain, src, count = 3;
let timerEl = document.getElementById('timer');
let countdown = setInterval(()=>{
  count--;
  if(count > 0){ timerEl.textContent = count; }
  else { clearInterval(countdown); timerEl.textContent = "0"; go(); }
},1000);

function go(){
  document.getElementById('intro').style.opacity=0;
  setTimeout(()=>document.getElementById('intro').style.display='none',1000);
  document.getElementById('main').style.opacity=1;
  if(!ctx){
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    src = ctx.createMediaElementSource(audio);
    gain = ctx.createGain(); gain.gain.value = 4.0;
    src.connect(gain); gain.connect(ctx.destination);
  }
  ctx.resume(); audio.volume=1; audio.muted=false; audio.play().catch(()=>{});
  typeText();
}
const vocab=["Dear","Youssra","I","want","to","take","a","moment","to","sincerely","thank","you","Thank","you","so","much","for","your","incredible","support","your","help","and","your","kindness","I","may","not","know","you","very","well","but","your","generosity","and","your","good","heart","did","not","go","unnoticed","I","am","truly","grateful","for","everything","you","have","done","for","me","Your","time","your","effort","and","your","thoughtfulness","mean","a","lot","to","me","People","like","you","are","rare","to","find","You","have","my","utmost","respect","and","my","deepest","gratitude","Thank","you","again","Youssra","for","being","so","kind","and","supportive","Your","kindness","will","always","be","remembered","and","appreciated","With","all","my","respect","and","gratitude","Thank","you","Youssra"];
function typeText(){
  const box=document.getElementById('textBox'); let i=0;
  let t=setInterval(()=>{
    if(i>=vocab.length){ clearInterval(t); box.querySelector('.cursor')?.remove(); return; }
    box.querySelector('.cursor')?.remove();
    let s=document.createElement('span'); s.className='word '+(vocab[i]==='Youssra'?'youssra':'');
    s.textContent=vocab[i]+' '; box.appendChild(s);
    let c=document.createElement('span'); c.className='cursor'; box.appendChild(c); i++;
  },270);
}
</script>
</body>
    </html>
